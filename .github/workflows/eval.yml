name: Eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC

jobs:
  suites:
    # Offline regression gate: no secrets, no network. Fails a PR that drops a
    # case, duplicates an input, breaks a canary, shrinks a suite below low-n, or
    # breaks the rubric label file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Suite integrity
        run: python scripts/check_suites.py
      - name: Label integrity
        run: python scripts/check_labels.py
      - name: Dist freshness
        # dist/ is gitignored and CI always builds fresh, so this cannot detect a
        # stale local wheel — that is the maintainer's pre-upload check. What it
        # proves here is that the wheel and sdist build and ship exactly the tree's
        # modules, suites, docs and scripts, so a broken [tool.hatch.build] config
        # fails instead of publishing a distribution with a file missing.
        run: |
          python -m build
          python scripts/check_dist.py

  calibrate:
    # Smoke calibration, NOT the published study. The published 36-row table is
    # regenerated by hand with --repeats 3 across all six suites and takes ~6h.
    # This job never runs on a PR because --update-readme mutates a tracked file.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Check for the API key
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is not configured; skipping the smoke calibration."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Calibrate
        if: steps.key.outputs.skip == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPEVAL_TELEMETRY_OPT_OUT: "1"
        run: |
          ideval calibrate \
            --suite factual --suite cultural \
            --subject kenari/qwen3-8-flash \
            --judge kenari/deepseek-v4-1-flash \
            --repeats 1 --out results_ci.json --update-readme
