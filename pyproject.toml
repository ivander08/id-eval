[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "id-eval"
dynamic = ["version"]
description = "Indonesian LLM evaluation toolkit: curated suites, calibrated LLM-as-judge, CI-ready."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ivn" }]
keywords = ["llm", "evaluation", "indonesian", "bahasa-indonesia", "llm-as-judge", "rag", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "openai>=1.40",
    "rich>=13.7",
]

[project.optional-dependencies]
deepeval = ["deepeval>=4.2"]
dev = ["pytest>=8.0", "build>=1.2", "twine>=5.0", "deepeval>=4.2"]

[project.urls]
Homepage = "https://github.com/ivander08/id-eval"
Repository = "https://github.com/ivander08/id-eval"
Issues = "https://github.com/ivander08/id-eval/issues"

[project.scripts]
ideval = "ideval.cli:app"

[tool.hatch.version]
path = "src/ideval/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ideval"]

[tool.hatch.build.targets.wheel.force-include]
"suites" = "ideval/suites"

[tool.hatch.build.targets.sdist]
include = ["src", "suites", "tests", "docs", "scripts", "README.md", "LICENSE", "pyproject.toml",
           "annotations/rubric_labels.jsonl", "annotations/review_decisions.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
