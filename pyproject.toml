[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "id-eval"
version = "0.1.0"
description = "Indonesian LLM evaluation toolkit: curated suites, calibrated LLM-as-judge, CI-ready."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "ivn" }]
keywords = ["llm", "evaluation", "indonesian", "bahasa-indonesia", "llm-as-judge", "rag", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "openai>=1.40",
    "rich>=13.7",
    "deepeval>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ideval = "ideval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ideval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
